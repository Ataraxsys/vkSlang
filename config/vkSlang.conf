# vkSlang configuration
# Lookup order: $VKSLANG_CONFIG, $XDG_CONFIG_HOME/vkSlang/vkSlang.conf,
#               ~/.config/vkSlang/vkSlang.conf
# Every key can be overridden by the matching VKSLANG_<KEY> environment variable
# (e.g. VKSLANG_PRESET, VKSLANG_SOURCE_RES).

# Absolute path to a libretro .slangp preset (required, otherwise pass-through).
preset = /usr/share/libretro/shaders/shaders_slang/crt/crt-royale.slangp

# Logical source resolution. The swapchain image is downsampled to this size
# before entering the filter chain, so OriginalSize / SourceSize (and therefore
# scanlines, masks, curvature) follow the retro resolution, not the 4K output.
# Empty or "native" = use the swapchain size.
source_res = 320x240

# Filter used for the downsample blit: nearest | linear
source_filter = nearest

# Region of the swapchain that contains the game picture:
#   full   : the whole swapchain image (default)
#   4:3    : centered region of that aspect ratio (gamescope pillarbox/letterbox)
#   X,Y,WxH: explicit rectangle in swapchain pixels
source_rect = full

# HDR (only used by HDR-aware presets, e.g. hdr/crt-sony-megatron-v2-default.slangp,
# on an HDR10 or scRGB swapchain):
# SDR reference white in nits (BrightnessNits)
brightness_nits = 200
# Colour boost (ExpandGamut): 0 Accurate, 1 Expanded, 2 Wide, 3 Super
expand_gamut = 0

# Restrict the layer to these executables (comma separated). Useful because
# ENABLE_VKSLANG=1 is inherited by every child of gamescope.
# process = gamescope

# Under Steam/Proton, a path that does not exist inside the container is
# retried under /run/host (the host filesystem).

# Control socket for vkslang-ui (live tweaking). 0 disables it.
# ipc = 1

# Preset parameter overrides: param.<NAME> = <value>
# param.CRT_GAMMA = 2.4
