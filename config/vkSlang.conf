# vkSlang configuration
#
# Lookup order: $VKSLANG_CONFIG, $XDG_CONFIG_HOME/vkSlang/vkSlang.conf,
#               ~/.config/vkSlang/vkSlang.conf
# Every key can be overridden by the matching VKSLANG_<KEY> environment
# variable (VKSLANG_PRESET, VKSLANG_SOURCE_RES...), which is the easiest way
# to give one game its own settings from a launcher.
#
# Everything set in this file applies to EVERY process the layer runs in,
# gamescope included. For a look meant for one game, save a profile from
# vkslang-ui and star it: that writes a profile.<executable> line below.

# ---------------------------------------------------------------- profiles

# Profile loaded automatically, by executable name (case-insensitive), or for
# every process. Profiles live in ~/.config/vkSlang/profiles and hold a whole
# look; anything spelled out below still overrides them.
# profile.soh.exe = Amiga 4:3
# profile = My default

# ------------------------------------------------------------------ preset

# Absolute path to a libretro .slangp preset. Without one, the layer stays
# out of the way entirely (and vkslang-ui cannot see the process).
# Several presets separated by commas are chained: the passes of the second
# run on the output of the first, and so on.
# preset = /usr/share/libretro/shaders/shaders_slang/crt/crt-royale.slangp

# Preset parameter overrides: param.<NAME> = <value>
# param.CRT_GAMMA = 2.4

# Restrict the layer to these executables (comma separated, case-insensitive).
# ENABLE_VKSLANG=1 is inherited by every child process, so with gamescope set
# this to gamescope to process its output only.
# process = gamescope

# ------------------------------------------------------------------ source

# Logical source resolution: the picture is reduced to this size before the
# preset sees it, so scanlines, masks and curvature follow the game's lines,
# not the 4K output.
#   native  : untouched (default)
#   /N      : the picture divided by N (keeps the aspect ratio), e.g. /3
#   50%     : same thing as a percentage
#   WxH     : a fixed size, e.g. 320x240
# source_res = native

# Filter for that reduction: nearest (default) | linear
# source_filter = nearest

# Repeat each source pixel per axis, for modes whose pixels are not square:
# "1,2" doubles the lines, so a DOS 320x200 mode gives the preset 400 real
# lines instead of stretching 200.
# pixel_duplicate = 1

# Region of the swapchain image that holds the game picture:
#   full     : the whole image (default)
#   4:3      : centred region of that aspect ratio (gamescope pillarboxing)
#   X,Y,WxH  : explicit rectangle in swapchain pixels
# source_rect = full

# Region the preset draws into, same syntax. Different from source_rect it
# stretches the picture: a 640x360 source drawn into a 4:3 area reproduces
# non-square pixels, with the scanlines stretched to match.
# display_rect = full

# Scales the drawn area, carrying the preset and the picture together. Below
# 1 it shrinks around its centre; above 1 it grows to the edges of the screen,
# never past them. One value for both axes, or "1.2,1.0".
# display_scale = 1.0

# Scales the picture inside that area by reading a smaller region (above 1)
# or a larger one (below 1). The preset keeps its geometry, so scanlines and
# mask keep their size: "1,2" makes the picture twice as tall.
# source_scale = 1.0

# ------------------------------------------------------------ presentation

# Presentations per application frame (1 = untouched). On a 240 Hz display
# with a 60 Hz game, 3 or 4 let interlacing presets alternate fields at the
# presentation rate (FrameCount advances per subframe, CurrentSubFrame and
# TotalSubFrames are bound).
#   subframe_mode = shader (default) runs the preset again for each subframe
#   subframe_mode = black  inserts black frames instead (BFI), almost free
# subframes = 1
# subframe_mode = shader

# --------------------------------------------------------------------- HDR

# Turn the game's SDR swapchain into an HDR10 one:
#   auto  (default) when the preset writes HDR (Sony Megatron) and the
#         display supports it, so an SDR game gets real HDR
#   force whenever the display supports HDR10
#   off   never touch the swapchain format
# hdr_output = auto

# Only used by HDR-aware presets (hdr/crt-sony-megatron-*.slangp):
# SDR reference white in nits (BrightnessNits)
# brightness_nits = 200
# Colour boost (ExpandGamut): 0 Accurate, 1 Expanded, 2 Wide, 3 Super
# expand_gamut = 0

# ------------------------------------------------------------------- other

# Control socket for vkslang-ui (live tweaking). 0 disables it.
# ipc = 1

# Under Steam/Proton, a path that does not exist inside the container is
# retried under /run/host (the host filesystem), so presets in /usr/share
# keep working there.
