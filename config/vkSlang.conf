# vkSlang configuration
# Lookup order: $VKSLANG_CONFIG, $XDG_CONFIG_HOME/vkSlang/vkSlang.conf,
#               ~/.config/vkSlang/vkSlang.conf
# Every key can be overridden by the matching VKSLANG_<KEY> environment variable
# (e.g. VKSLANG_PRESET, VKSLANG_SOURCE_RES).

# Absolute path to a libretro .slangp preset (required, otherwise pass-through).
preset = /usr/share/libretro/shaders/shaders_slang/crt/crt-royale.slangp

# Logical source resolution: WxH, /N to divide the picture (keeps the aspect
# ratio at any output resolution), a percentage, or native.
# The swapchain image is downsampled to this size
# before entering the filter chain, so OriginalSize / SourceSize (and therefore
# scanlines, masks, curvature) follow the retro resolution, not the 4K output.
# Empty or "native" = use the swapchain size.
source_res = 320x240
# source_res = /3

# Filter used for the downsample blit: nearest | linear
source_filter = nearest

# Region of the swapchain that contains the game picture:
#   full   : the whole swapchain image (default)
#   4:3    : centered region of that aspect ratio (gamescope pillarbox/letterbox)
#   X,Y,WxH: explicit rectangle in swapchain pixels
source_rect = full

# Region the preset draws into: full | 4:3 | X,Y,WxH. Different from
# source_rect it stretches the picture: a 640x360 source drawn into a 4:3 area
# reproduces non-square pixels, with the scanlines stretched to match.
display_rect = full

# Below 1.0 the drawn area shrinks around its centre. Above 1.0 it grows until
# it reaches the edges of the screen, and only then is the picture cropped, on
# the axis that could not grow: a 4:3 area on a 16:9 screen widens first and
# loses its top and bottom, never its sides.
# One value scales both axes, "1.2,1.0" scales them separately.
display_scale = 1.0

# Presentations per application frame (1 = untouched). On a 240 Hz display
# with a 60 Hz game, 3 or 4 let interlacing presets alternate fields at the
# presentation rate instead of the game's frame rate (FrameCount advances per
# subframe, CurrentSubFrame/TotalSubFrames are bound).
#   subframe_mode = shader (default) runs the preset again for each subframe
#   subframe_mode = black  inserts black frames (BFI), almost free
# subframes = 3
# subframe_mode = shader

# HDR output promotion: off | auto | force
#   auto  (default) turn the game's SDR swapchain into an HDR10 one when the
#         preset writes HDR (Sony Megatron), so an SDR game gets real HDR
#   force always promote when the surface supports HDR10
#   off   never touch the swapchain format
hdr_output = auto

# HDR (only used by HDR-aware presets, e.g. hdr/crt-sony-megatron-v2-default.slangp,
# on an HDR10 or scRGB swapchain):
# SDR reference white in nits (BrightnessNits)
brightness_nits = 200
# Colour boost (ExpandGamut): 0 Accurate, 1 Expanded, 2 Wide, 3 Super
expand_gamut = 0

# Restrict the layer to these executables (comma separated). Useful because
# ENABLE_VKSLANG=1 is inherited by every child of gamescope.
# process = gamescope

# Under Steam/Proton, a path that does not exist inside the container is
# retried under /run/host (the host filesystem).

# Control socket for vkslang-ui (live tweaking). 0 disables it.
# ipc = 1

# Preset parameter overrides: param.<NAME> = <value>
# param.CRT_GAMMA = 2.4
