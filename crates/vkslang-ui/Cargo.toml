[package]
name = "vkslang-ui"
description = "Live control panel for the vkSlang Vulkan layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
vkslang-ipc.workspace = true
# OpenGL (glow) backend on purpose: a Vulkan-based UI would itself load the
# vkSlang layer when ENABLE_VKSLANG=1 is exported globally.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
