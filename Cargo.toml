[workspace]
resolver = "2"
members = ["crates/vkslang", "crates/vkslang-ipc", "crates/vkslang-ui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Ataraxsys/vkSlang"

[workspace.dependencies]
vkslang-ipc = { path = "crates/vkslang-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
# A panic must never unwind across the extern "system" boundary into the
# application.
panic = "abort"
strip = "debuginfo"

[profile.dev]
panic = "abort"
