name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Test
        run: cargo test --release --workspace
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      - name: Check exported symbols
        run: |
          nm -D --defined-only target/release/libvkslang.so | grep -E ' vk(NegotiateLoaderLayerInterfaceVersion|GetInstanceProcAddr|GetDeviceProcAddr)$'
      - name: Validate manifest
        run: python3 -m json.tool layer/vkslang.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: libvkslang-x86_64
          path: |
            target/release/libvkslang.so
            target/release/vkslang-ui
            layer/vkslang.json
